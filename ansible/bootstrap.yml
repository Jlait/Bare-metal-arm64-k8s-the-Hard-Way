# First run (password auth): ansible-playbook bootstrap.yml --ask-pass --ask-become-pass
# If sudo isn't installed in the template, add: -e ansible_become_method=su
- name: Bootstrap VMs for Kubernetes the Hard Way
  hosts: all
  tasks:
    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true

    - name: Allow debian passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/debian
        content: "debian ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Authorize SSH key
      ansible.posix.authorized_key:
        user: debian
        key: "{{ lookup('file', '~/.ssh/k8s-hard-way.pub') }}"

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Set local hostname entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}.kubernetes.local {{ inventory_hostname }}"

    - name: Add cluster machines to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} kubernetes the hard way"
        block: |
          {% for host in groups['server'] + groups['nodes'] %}
          {{ hostvars[host].ansible_host }} {{ host }}.kubernetes.local {{ host }}
          {% endfor %}

- name: Lab 03 - Prepare jumpbox
  hosts: jumpbox
  tasks:
    - name: Copy machines.txt
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../machines.txt"
        dest: /root/machines.txt
        mode: "0644"

    - name: Generate root SSH key
      ansible.builtin.command: ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
      args:
        creates: /root/.ssh/id_ed25519

    - name: Read root public key
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: jumpbox_pubkey
      
- name: Lab 03 - Allow root SSH from jumpbox
  hosts: server:nodes
  tasks:
    - name: Authorize jumpbox key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ hostvars['jumpbox'].jumpbox_pubkey.content | b64decode }}"